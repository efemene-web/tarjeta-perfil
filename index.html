<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Juan Perez Geek  </title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
</head>
<body>
  <div class="tarjeta">
    <img src="https://picsum.photos/200" alt="Foto de perfil">
    <h2>Juan Pérez</h2>
    <p>Diseñador y entusiasta de la tecnología. Me gusta crear cosas.</p>

    <div class="redes">
      <button>Twitter</button>
      <button>Instagram</button>
      <button>LinkedIn</button>
      <button id="seguir">Seguir</button>
    </div>

    <p id="contador">Clicks: 0</p>

    <div class="comentarios">
      <input type="text" id="inputComentario" placeholder="Escribí un comentario...">
      <button id="botonComentar">Enviar</button>
      <ul id="listaComentarios"></ul>
    </div>

  </div>
  <script src="script.js"></script>
</body>
